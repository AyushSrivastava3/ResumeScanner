
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Profiles</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .main-content {

flex: 1;
display: flex;
flex-direction: column;
align-items: center;
padding: 20px;
margin-top: 50px;
margin-bottom: 60px;
}

        .filter-container {
            
            display: inline-flex;
            justify-content: space-between;
            align-items: center;
            margin-left: 0;
            margin-right: 0;
            margin-bottom: 10px;
            width: 100%;
        }
                .filter-group {
            display: flex;
            align-items: center;
        }
        .filter-container label {
            font-weight: bold;
            margin-right: 10px;
        }
        .filter-group label {
            margin-right: 10px;
            margin-left: 10px;
        }

        #jdFilter, #exportBtn {
            margin-left: 10px;
            padding: 5px;
            font-size: 16px;
            margin-right: 10px; /* Add space between the dropdown and the export button */
        }
        #jdFilter{
            padding: 8px 30px 8px 8px; /* Adjust padding to make space for the icon */
            margin: 0 10px;
            width: 250px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        #exportBtn {
             /* Adjust padding to make space for the icon */
            margin: 0 10px;
            
            border-radius: 5px;
            border: 1px solid #ccc;
            cursor: pointer;
        }

        select, input[type="text"], input[type="email"] {
            width: 300px; /* Fixed width to keep select element centered */
            padding: 8px;
            box-sizing: border-box;
            margin-bottom: 10px; /* Add spacing between input elements */
            display: inline-block;
            
        }

        .container {
            width: 100%;
            
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin: 0 20px;
            margin-top: 0;
        }
        .search-container {
            position: relative;
            display: inline-block;
            margin-bottom:0;
        }
        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            color: #aaa;
            pointer-events: none; /* Make sure the icon doesn't interfere with input interaction */
        }
        #searchInput {
            padding: 8px 30px 8px 8px; /* Adjust padding to make space for the icon */
            margin: 0 10px;
            width: 250px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        table, td, th {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        td label {
            display: inline-block;
            width: 100px;
            font-weight: bold;
        }

        .center-align {
            text-align: center;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 4px;
            background-color: #005149;
            color: #fff;
            cursor: pointer;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .loader {
            display: none; /* Hidden by default */
            font-size: 20px;
            color: #333;
            text-align: center;
            padding: 20px;
            background-color: #f9f9f9;
            border: 1px solid #ccc;
            border-radius: 8px;
            width: 200px;
            margin: 20px auto;
        }

        .loader-visible {
            display: block;
        }
        .pagination-container {
    text-align: center;
    margin-top: 20px;
}
.editable-name{
    color: #005149;
}

.pagination-container button {
    padding: 10px 20px;
    margin: 0 5px;
    border: none;
    border-radius: 4px;
    background-color: #005149;
    color: #fff;
    cursor: pointer;
}

.pagination-container button:disabled {
    background-color: #ccc;
    cursor: not-allowed;
}

.pagination-container span {
    font-size: 16px;
}


    </style>
    
</head>
<body>
<div id="header"></div>
<div class="main-content">
    <h1>Profiles</h1>
    <div id="loader" class="loader" style="display: none;">Loading...</div>

    <div class="filter-container">
        <div class="filter-group">
            <label for="jdFilter">Select Job Description:</label>
            <select id="jdFilter">
                <option value="">All</option>
            </select>
            <button id="exportBtn" disabled>Export</button>
        </div>
        
        <div class="filter-group">
            <label for="searchInput">Search profiles:</label>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search profiles..." />
                <span class="search-icon">&#128269;</span>
            </div>
        </div>
    </div>
    <div class="container">
        <div id="profilesContainer"></div>
    </div>
    <div class="pagination-container">
        <button id="prevPage" disabled>Previous</button>
        <span id="pageNumbers"></span>
        <button id="nextPage" disabled>Next</button>
    </div>
    
</div>

<div id="footer"></div>

<script>
    fetch('header.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('header').innerHTML = data;
            // Call updateNavbar after header is inserted
            updateNavbar();
        });
        // Function to check login status and update navbar
function updateNavbar() {
    const username = localStorage.getItem('username'); // Fetch username from local storage
    const loginRegisterLink = document.getElementById('loginRegisterLink');
    const signOutButton = document.getElementById('signOutButton');

    if (username) {
        loginRegisterLink.textContent = `LoggedIn / ${username}`; // Update the link text to show the username
        signOutButton.style.display = 'block'; // Show the Sign Out button
    } else {
        loginRegisterLink.textContent = 'Login/Register'; // Default text if no username
        signOutButton.style.display = 'none'; // Hide Sign Out button if no username
    }
}
function signOut() {
        console.log('Signing out...');
        localStorage.removeItem('accessToken');
        localStorage.setItem('isLoggedIn', 'false');
        localStorage.removeItem('username');
        loginRegisterLink.textContent = 'Login/Register';
        redirectToLogin();
    }

    function redirectToLogin() {
        console.log("i am in the redirect");
        window.location.href = 'login.html';
    }

    fetch('footer.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('footer').innerHTML = data;
        });

    document.addEventListener('DOMContentLoaded', function() {
    const jdFilter = document.getElementById('jdFilter');
    const exportBtn = document.getElementById('exportBtn');
    const profilesContainer = document.getElementById('profilesContainer');
    const searchInput = document.getElementById('searchInput');
    const token = localStorage.getItem('accessToken');
    const loader = document.getElementById('loader');
    const prevPageBtn = document.getElementById('prevPage');
    const nextPageBtn = document.getElementById('nextPage');
    const pageNumbersContainer = document.getElementById('pageNumbers');
    const profilesPerPage = 10;
    let currentPage = 1;
    let totalPages = 1;
    let fileId = null;
    let allProfiles = []; 
    let filteredProfiles = []; // Maintain separate filtered profiles

    jdFilter.addEventListener('change', function() {
        const jdId = jdFilter.value;
        if (jdId) {
            fetchProfilesByJdId(jdId);
            exportBtn.disabled = false;
        } else {
            fetchAllProfiles();
            exportBtn.disabled = true;
        }
    });

    exportBtn.addEventListener('click', function() {
        const jdId = jdFilter.value;
        if (jdId) {
            exportProfilesByJdId(jdId);
        }
    });

    searchInput.addEventListener('input', function() {
        const searchTerm = searchInput.value.toLowerCase();
        filteredProfiles = allProfiles.filter(profile => {
            return profile.name.toLowerCase().includes(searchTerm) ||
                   profile.emailId.toLowerCase().includes(searchTerm) ||
                   profile.mobNo.includes(searchTerm);
        });
        currentPage = 1; // Reset to the first page after search
        totalPages = Math.ceil(filteredProfiles.length / profilesPerPage);
        displayProfiles();
    });

    function populateJdFilter() {
        fetch('http://43.205.154.85:8080/jd/getIds', {
            headers: {
                'Authorization': `Bearer ${token}`
            }
        })
            .then(response => response.json())
            .then(data => {
                data.forEach(item => {
                    const option = document.createElement('option');
                    option.value = item.id;
                    option.textContent = item.title;
                    jdFilter.appendChild(option);
                });
            })
            .catch(error => console.error('Error fetching job descriptions:', error));
    }

    function fetchAllProfiles() {
        fetch('http://43.205.154.85:8080/getAllProfile', {
            headers: {
                'Authorization': `Bearer ${token}`
            }
        })
            .then(response => response.json())
            .then(data => {
                allProfiles = data;  // Store all profiles
                filteredProfiles = data; // Initialize filtered profiles with all profiles
                totalPages = Math.ceil(filteredProfiles.length / profilesPerPage);
                displayProfiles();
            })
            .catch(error => console.error('Error fetching all profiles:', error));
    }
    prevPageBtn.addEventListener('click', () => changePage(-1));
    nextPageBtn.addEventListener('click', () => changePage(1));

    function fetchProfilesByJdId(jdId) {
        loader.classList.add('loader-visible'); // Show loader
        fetch(`http://43.205.154.85:8080/jd/${jdId}`, {
            headers: {
                'Authorization': `Bearer ${token}`
            }
        })
            .then(response => response.json())
            .then(data => {
                loader.classList.remove('loader-visible'); 
                allProfiles = data;  // Store all profiles
                filteredProfiles = data; // Initialize filtered profiles with fetched data
                totalPages = Math.ceil(filteredProfiles.length / profilesPerPage);
                displayProfiles();
            })
            .catch(error => {
            console.error('Error fetching all profiles:', error);
            loader.classList.remove('loader-visible'); // Hide loader even on error
        });
    }

    function exportProfilesByJdId(jdId) {
        fetch(`http://43.205.154.85:8080/profile/export/jdid?jdid=${jdId}`, {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json'
            }
        })
        .then(response => response.blob())
        .then(blob => {
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'profiles_by_id_export.xlsx'; // Set the file name for the export
            a.click();
            window.URL.revokeObjectURL(url);
        })
        .catch(error => console.error('Error exporting profile data:', error));
    }

    function downloadProfile(fileId, profileName) {
        console.log("fileId :", fileId);
        if (!token) {
            console.error("No token found. Please log in.");
            return;
        }
        if (fileId) {
            fetch(`http://43.205.154.85:8080/getResume?resumeId=${fileId}`, {
                headers: {
                    "Authorization": `Bearer ${token}`
                }
            })
            .then(response => {
             if (!response.ok) {
                 throw new Error('Network response was not ok ' + response.statusText);
             }
             return response.blob();
         })
         .then(blob => {
             const url = window.URL.createObjectURL(blob);
             const a = document.createElement('a');
             a.style.display = 'none';
             a.href = url;
             const downloadFileName = profileName.value ? `${profileName.value.replace(/[^a-zA-Z0-9]/g, '_')}_resume.pdf` : 'resume.pdf';
             a.download = downloadFileName;
             document.body.appendChild(a);
             a.click();
             window.URL.revokeObjectURL(url);
             
         })
            .catch(error => console.error('Error downloading file:', error));
        } else {
            alert('No file available for download.');
        }
    }

    function displayProfiles() {
        profilesContainer.innerHTML = '';
        const startIndex = (currentPage - 1) * profilesPerPage;
        const endIndex = Math.min(startIndex + profilesPerPage, filteredProfiles.length);
        const profilesToDisplay = filteredProfiles.slice(startIndex, endIndex);

        if (profilesToDisplay.length > 0) {
            const table = document.createElement('table');
            table.classList.add('profiles-table');
            table.innerHTML = `
                <tr>
                    <th>Name</th>
                    <th>Email ID</th>
                    <th>Mobile No</th>
                    <th>Current CTC</th>
                    <th>Expected CTC</th>
                    <th>Location</th>
                    <th>Actions</th>
                    <th>Download</th>
                </tr>
            `;
            profilesToDisplay.forEach(profile => {
                console.log("profile :",profile);
                console.log("profile.fileId :",profile.fileid);
                console.log("profile.name :",profile.name);
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><a href="profile.html?id=${profile.id}" class="editable-name"><h3>${profile.name}</h3></a></td>
                    <td>${profile.emailId}</td>
                    <td>${profile.mobNo}</td>
                    <td>${profile.current_ctc || ''}</td>
                    <td>${profile.expected_ctc || ''}</td>
                    <td>${profile.current_location || ''}</td>
                    <td>
                        <button class="editBtn" data-profile-id="${profile.id}">Edit</button>
                    </td>
                    <td>
                        <button class="downloadBtn" data-profile-id="${profile.id}" data-profile-name="${profile.name}" data-file-id="${profile.fileid || ''}">Download</button>
                    </td>
                `;
                table.appendChild(row);
            });
            profilesContainer.appendChild(table);

            document.querySelectorAll('.editBtn').forEach(button => {
                button.addEventListener('click', function() {
                    const profileId = this.getAttribute('data-profile-id');
                    window.location.href = `editprofile.html?id=${profileId}`;
                });
            });

            document.querySelectorAll('.downloadBtn').forEach(button => {
                button.addEventListener('click', function() {
                    const profileId = this.getAttribute('data-profile-id');
                    const profileName = this.getAttribute('data-profile-name');
                    const fileId = this.getAttribute('data-file-id');

                    if (fileId) {
                        downloadProfile(fileId, profileName);
                    } else {
                        alert("No file associated with this profile.");
                    }
                });
            });

            // Add event listener for name links (optional, if you need any additional functionality)
            document.querySelectorAll('.editable-name').forEach(link => {
                link.addEventListener('click', function(event) {
                    event.preventDefault();
                    const profileId = new URL(this.href).searchParams.get('id');
                    window.location.href = `editprofile.html?id=${profileId}`;
                });
            });
        } else {
            profilesContainer.innerHTML = '<p>No profiles found.</p>';
        }

        updatePaginationControls();
    }

    function updatePaginationControls() {
        prevPageBtn.disabled = currentPage === 1;
        nextPageBtn.disabled = currentPage === totalPages;
        pageNumbersContainer.innerHTML = `Page ${currentPage} of ${totalPages}`;
    }
    function changePage(offset) {
        currentPage += offset;
        currentPage = Math.max(1, Math.min(currentPage, totalPages));
        displayProfiles();
    }

    // Initial data fetch
    populateJdFilter();
    fetchAllProfiles();
});
</script>
</body>
</html>
