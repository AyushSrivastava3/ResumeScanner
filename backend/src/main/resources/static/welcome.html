<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Pro-Square</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ffffff, #f0f4f8);
            overflow: hidden;
            color: #005149;
        }

        .welcome-message {
            text-align: center;
            animation: fadeIn 1.5s ease-in-out;
        }

        h1 {
            margin: 0;
            font-size: 60px;
            font-weight: 700;
            color: #005149;
            letter-spacing: 1.5px;
            animation: slideIn 2s ease-out;
        }

        p {
            margin-top: 20px;
            font-size: 24px;
            font-weight: 400;
            letter-spacing: 1px;
            color: #005149;
            animation: fadeInUp 2s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideIn {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes fadeInUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .highlight {
            color: #ffffff;
            background-color: #005149;
            padding: 10px 15px;
            border-radius: 25px;
            display: inline-block;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
<div class="welcome-message">
    <h1>Welcome to <span class="highlight">Pro-Square</span></h1>
    <p>Your Professional HR Platform</p>
</div>

<script>
    // Redirect to login page after 3 seconds
    setTimeout(function() {
        window.location.href = 'login.html';
    }, 3000);
</script>
</body>
</html>
