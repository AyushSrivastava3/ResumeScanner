<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee List</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .modal { display: none; } /* Hidden by default */
        .modal.active { display: flex; } /* Show modal when active */
        body {
            display: flex;
            flex-direction: column;
            height: 100vh; /* Take full height of viewport */
        }
        footer {
          margin-top: auto;
             height: 70px;
        }
        header{

            height: 55px; /* Fixed height for header */
            /* Other styles if needed */
            padding-left:0px;
            padding-right:0px;

        }
        }
         #employeeContainer {
            flex-grow: 1; /* Allow the employee container to grow */
        }
    </style>
</head>
<body class="bg-white-100">
<div id="header"></div>
<div class="w-95% mt-20 flex-grow px-4 ">
    <h2 class="text-3xl font-semibold mb-2 mt-1 text-center">Employee List</h2>
    <div id="employeeContainer" class="hidden ">
        <table class="w-full bg-white rounded shadow-md overflow-hidden">
            <thead class="bg-gray-200">
            <tr>
                <th class="py-3 px-4 border-b border-gray-300 text-left">Name</th>
                <th class="py-3 px-4 border-b border-gray-300 text-left">Email</th>
                <th class="py-3 px-4 border-b border-gray-300 text-left">Phone</th>
                <th class="py-3 px-4 border-b border-gray-300 text-left">Job Title</th>
<!--                <th class="py-3 px-4 border-b border-gray-300 text-left">Join Date</th>-->
                <th class="py-3 px-4 border-b border-gray-300 text-left">Type</th>
<!--                <th class="py-3 px-4 border-b border-gray-300 text-left">Salary</th>-->
<!--                <th class="py-3 px-4 border-b border-gray-300 text-left">Hourly Rate</th>-->
<!--                <th class="py-3 px-4 border-b border-gray-300 text-left">Contract End Date</th>-->
                <th class="py-3 px-4 border-b border-gray-300 text-left">Actions</th>
            </tr>
            </thead>
            <tbody id="employeeList">
            <!-- Employee rows will be added here dynamically -->
            </tbody>
        </table>
    </div>
    <p id="noEmployees" class="text-gray-600 hidden text-center">No employees found.</p>
</div>

<div id="footer"></div>
<script>
    fetch('header.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('header').innerHTML = data;
            // Call updateNavbar after header is inserted
            updateNavbar();
        });
        // Function to check login status and update navbar
function updateNavbar() {
    const username = localStorage.getItem('username'); // Fetch username from local storage
    const loginRegisterLink = document.getElementById('loginRegisterLink');
    const signOutButton = document.getElementById('signOutButton');

    if (username) {
        loginRegisterLink.textContent = `LoggedIn / ${username}`; // Update the link text to show the username
        signOutButton.style.display = 'block'; // Show the Sign Out button
    } else {
        loginRegisterLink.textContent = 'Login/Register'; // Default text if no username
        signOutButton.style.display = 'none'; // Hide Sign Out button if no username
    }
}
function signOut() {
        console.log('Signing out...');
        localStorage.removeItem('accessToken');
        localStorage.setItem('isLoggedIn', 'false');
        localStorage.removeItem('username');
        loginRegisterLink.textContent = 'Login/Register';
        redirectToLogin();

    }

    function redirectToLogin() {
        console.log("i am in the redirect");
        window.location.href = 'login.html';
    }

        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer').innerHTML = data;
            });
    // Function to fetch and display employees
    function fetchEmployees() {
        $.ajax({
            url: 'http://43.205.154.85:8080/employees', // Adjust this URL based on your API
            method: 'GET',
            success: function(data) {
                const employeeList = $('#employeeList');
                const noEmployees = $('#noEmployees');
                employeeList.empty(); // Clear previous data
                if (data.length > 0) {
                    data.forEach(employee => {
                        const row = `
                            <tr class="bg-gray-10 hover:bg-gray-200 transition duration-300 ease-in-out transform hover:scale-105  rounded-lg">
                                <td class="py-2 px-4 border-b border-gray-300">${employee.name}</td>
                                <td class="py-2 px-4 border-b border-gray-300">${employee.email}</td>
                                <td class="py-2 px-4 border-b border-gray-300">${employee.phone}</td>
                                <td class="py-2 px-4 border-b border-gray-300">${employee.jobTitle}</td>
<!--                                <td class="py-2 px-4 border-b border-gray-300">${employee.joinDate}</td>-->
                                <td class="py-2 px-4 border-b border-gray-300">${employee.employeeType}</td>
<!--                                <td class="py-2 px-4 border-b border-gray-300">${employee.salary || ''}</td>-->
<!--                                <td class="py-2 px-4 border-b border-gray-300">${employee.hourlyRate || ''}</td>-->
<!--                                <td class="py-2 px-4 border-b border-gray-300">${employee.contractEndDate || ''}</td>-->
                                <td class="py-2 px-4 border-b border-gray-300 flex space-x-2">

                                    <button class="text-red-500 hover:text-red-700" onclick="deleteEmployee('${employee.id}')">
                                        Delete
                                    </button>
                                </td>
                            </tr>
                        `;
                        employeeList.append(row);
                    });
                    $('#employeeContainer').removeClass('hidden');
                    noEmployees.addClass('hidden');
                } else {
                    $('#employeeContainer').addClass('hidden');
                    noEmployees.removeClass('hidden');
                }
            },
            error: function(err) {
                console.error('Error fetching employees:', err);
            }
        });
    }


    // Function to delete an employee
    function deleteEmployee(employeeId) {
        $.ajax({
            url: `http://43.205.154.85:8080/employees/${employeeId}`,
            method: 'DELETE',
            success: function() {
                fetchEmployees(); // Refresh the employee list
            },
            error: function(err) {
                console.error('Error deleting employee:', err);
            }
        });
    }

    // Fetch employees on page load
    $(document).ready(function() {
        fetchEmployees();
    });
</script>
</body>
</html>
