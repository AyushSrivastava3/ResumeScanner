<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Invoices</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {

            margin: 50px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            margin-top: 50px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .container h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;

        }
        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
            vertical-align:middle;
            height: 50px;
        }
        th {
            background-color: #f4f4f4;
        }
        button {
            background-color: #005149;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        button:hover {
            background-color: #003d3d;
        }

        .header-content {
            position: absolute;
            top: 5px;
            right: 20px;
            display: flex;
            margin-top: 60px;
            gap: 5px;
        }
        .header-content nav ul {
            list-style: none;
            display: flex;
            gap: 5px;
        }
        .header-content nav ul li {
            padding: 10px 15px;
            font-size: 14px;
            background-color: #8c9393;
            border-radius: 4px;
        }
        .header-content nav ul li:hover{
            background-color: #005149;
        }
        .header-content nav ul li a {
            color: #fff;
            text-decoration: none;
        }

        /* Pagination styles */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }

        .pagination button {
            background-color: #005149;
            color: #fff;
            border: none;
            padding: 8px 12px;
            margin: 0 5px;
            border-radius: 4px;
            cursor: pointer;
        }

        .pagination button:disabled {
            background-color: #ddd;
            cursor: not-allowed;
        }

        .pagination span {
            font-size: 14px;
            margin: 0 10px;
        }
        .form-group {
    float: right;
    margin: 0; /* Optional: Adjust margins as needed */
    padding: 10px;
}
         #loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #fff; /* White background */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #005149; /* Spinner color */
    font-family: 'Arial', sans-serif;
    z-index: 1000; /* Ensure it's on top of other content */
    text-align: center;
}

.spinner {
    border: 6px solid rgba(0, 81, 73, 0.3); /* Light version of #005149 */
    border-top: 6px solid #005149; /* #005149 for the spinning part */
    border-radius: 50%;
    width: 50px;
    height: 50px;
    animation: spin 1s linear infinite;
    margin-bottom: 20px;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.loading-text {
    font-size: 24px;
    letter-spacing: 1px;
    color: #005149; /* Text color to match the spinner */
}


    </style>
</head>
<body>
<div id="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Loading your page...</div>
</div>
<div id="header"></div>
<div class="header-content" id="page-content" style="display: none;">
    <nav>
        <ul>
            <li><a href="clients.html">Clients</a></li>
            <li><a href="all-invoices.html">Invoices</a></li>
            <li><a href="pendinginvoices.html">Pending Invoices</a></li>
        </ul>
    </nav>
</div>

<div class="container">

    <h2>All Invoices</h2>


    <!-- CSV Import Section -->
    <div class="form-group">
        <label for="csvUpload">Add Invoices Using CSV:</label>
        <input type="file" id="csvUpload" accept=".csv">
        <button type="button" id="importCsvBtn" disabled>Import from CSV</button>

    </div>
    <div>
        <label for="exportBtn">Export Invoices:</label>
        <button id="exportBtn">Export Invoices</button>
    </div>

    <!-- Export button -->
    <table id="invoicesTable">
        <thead>
        <tr>
            <th>Invoice Number</th>
            <th>Client Name</th>
            <th>Invoice Value</th>
            <th>Currency</th>
        </tr>
        </thead>
        <tbody>
        <!-- Rows will be added dynamically here -->
        </tbody>
    </table>
    <!-- Pagination Controls -->
    <div class="pagination">
        <button id="prevPageBtn" disabled>Previous</button>
        <span id="pageNumbersContainer">Page 1 of 1</span>
        <button id="nextPageBtn" disabled>Next</button>
    </div>
</div>

<div id="footer"></div>

<script>

    (function() {
        const token = localStorage.getItem('accessToken');

        // If the token is missing, redirect to the login page immediately
        if (!token) {
            window.location.href = 'login.html';
            return;
        }

        // Validate the token by making a quick API call
        fetch('http://43.205.154.85:8080/profile/count', {
            headers: {
                "Authorization": `Bearer ${token}`
            }
        })
        .then(response => {
            if (!response.ok) {
                // If token validation fails, redirect to the login page immediately
                window.location.href = 'login.html';
            }
            // No further actions needed as page loading continues only if the token is valid
        })
        .catch(error => {
            // In case of any error, redirect to the login page
            console.error('Error:', error);
            window.location.href = 'login.html';
        });
    })();

    window.addEventListener('load', function() {
    // Show the loading overlay
    const loadingOverlay = document.getElementById('loading-overlay');
    const pageContent = document.getElementById('page-content');

    // Set a timeout to hide the loading overlay and show the page content
    setTimeout(function() {
        loadingOverlay.style.display = 'none'; // Hide the loading overlay
        pageContent.style.display = 'block';   // Show the page content
    }, 1000); // 1000 milliseconds = 1 second
});

    const token = localStorage.getItem('accessToken');
    let currentPage = 1; // Start with the first page
    const limit = 10; // Number of items per page
    let invoices = []; // To store all invoices data

    fetch('header.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('header').innerHTML = data;
        });

    fetch('footer.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('footer').innerHTML = data;
        });

    document.addEventListener('DOMContentLoaded', function() {
        const token = localStorage.getItem('accessToken');

        if (!token) {
            showModal("You have not yet logged in. Kindly login first.");
            return;
        }

        function showModal(message) {
            const modal = document.createElement('div');
            modal.style.position = 'fixed';
            modal.style.top = '50%';
            modal.style.left = '50%';
            modal.style.transform = 'translate(-50%, -50%)';
            modal.style.padding = '20px';
            modal.style.backgroundColor = '#fff';
            modal.style.boxShadow = '0 0 10px rgba(0, 0, 0, 0.1)';
            modal.innerHTML = `
                <p>${message}</p>
                <button id="closeModal">Close</button>
            `;
            document.body.appendChild(modal);

            document.getElementById('closeModal').addEventListener('click', function() {
                modal.remove();
                window.location.href = 'login.html'; // Redirect to login page
            });

            document.getElementById('closeModal').style.backgroundColor = '#005149';
            document.getElementById('closeModal').style.color = '#fff';
            document.getElementById('closeModal').style.border = 'none';
            document.getElementById('closeModal').style.padding = '10px';
            document.getElementById('closeModal').style.borderRadius = '5px';
            document.getElementById('closeModal').style.cursor = 'pointer';
        }

        // fetch('http://43.205.154.85:8080/api/invoices/all')
        //     .then(response => response.json())
        //     .then(invoices => {
        //         const invoicesTable = document.getElementById('invoicesTable').getElementsByTagName('tbody')[0];
        //         invoices.forEach(invoice => {
        //             const row = invoicesTable.insertRow();
        //             const invoiceNumberCell = row.insertCell(0);
        //             const invoiceLink = document.createElement('a');
        //             invoiceLink.href = `editInvoice.html?id=${invoice.id}`;
        //             invoiceLink.textContent = invoice.invoiceNumber;
        //             invoiceNumberCell.appendChild(invoiceLink);
        //             row.insertCell(1).textContent = invoice.clientName; // Assuming invoice contains clientName
        //             row.insertCell(2).textContent = invoice.invoiceValue;
        //             row.insertCell(3).textContent = invoice.currency;
        //         });
        //     })
        //     .catch(error => console.error('Error fetching invoices:', error));


        function fetchInvoices() {
        fetch('http://43.205.154.85:8080/api/invoices/all')
            .then(response => response.json())
            .then(data => {
                invoices = data; // Store all invoices data
                updateTable();
                updatePagination();
            })
            .catch(error => console.error('Error fetching invoices:', error));
    }

    function updateTable() {
        const invoicesTable = document.getElementById('invoicesTable').getElementsByTagName('tbody')[0];
        invoicesTable.innerHTML = ''; // Clear previous rows
        const startIndex = (currentPage - 1) * limit;
        const endIndex = Math.min(startIndex + limit, invoices.length);

        for (let i = startIndex; i < endIndex; i++) {
            const invoice = invoices[i];
            const row = invoicesTable.insertRow();
            const invoiceNumberCell = row.insertCell(0);
            const invoiceLink = document.createElement('a');
            invoiceLink.href = `editInvoice.html?id=${invoice.id}`;
            invoiceLink.textContent = invoice.invoiceNumber;
            invoiceNumberCell.appendChild(invoiceLink);
            row.insertCell(1).textContent = invoice.clientName;
            row.insertCell(2).textContent = invoice.invoiceValue;
            row.insertCell(3).textContent = invoice.currency;
        }
    }

    function updatePagination() {
        const totalPages = Math.ceil(invoices.length / limit);
        document.getElementById('pageNumbersContainer').textContent = `Page ${currentPage} of ${totalPages}`;
        document.getElementById('prevPageBtn').disabled = currentPage <= 1;
        document.getElementById('nextPageBtn').disabled = currentPage >= totalPages;
    }

    function updatePage(newPage) {
        if (newPage < 1) return;
        currentPage = newPage;
        updateTable();
        updatePagination();
    }

    document.getElementById('prevPageBtn').addEventListener('click', function() {
        updatePage(currentPage - 1);
    });

    document.getElementById('nextPageBtn').addEventListener('click', function() {
        updatePage(currentPage + 1);
    });

    // Initial fetch
    fetchInvoices();
        function exportClients() {
            fetch(`http://43.205.154.85:8080/api/invoices/export/invoices`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.blob())
            .then(blob => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'invoices_export.xlsx'; // Set the file name for the export
                a.click();
                window.URL.revokeObjectURL(url);
            })
            .catch(error => console.error('Error exporting invoice data:', error));
        }

        document.getElementById('exportBtn').addEventListener('click', exportClients);

         // CSV Import functionality
        const csvUpload = document.getElementById('csvUpload');
        const importCsvBtn = document.getElementById('importCsvBtn');
        const feedbackMessage = document.getElementById('feedbackMessage');

        csvUpload.addEventListener('change', function() {
            importCsvBtn.disabled = !csvUpload.files.length;
        });

        importCsvBtn.addEventListener('click', function() {
            const file = csvUpload.files[0];
            if (file) {
                const formData = new FormData();
                formData.append('file', file);

               fetch('http://43.205.154.85:8080/api/invoices/import/invoices', {
    method: 'POST',
    headers: {
        "Authorization": `Bearer ${token}`
    },
    body: formData
})
.then(response => {
    return response.json().then(data => ({
        status: response.status,
        body: data
    }));
})
.then(({ status, body }) => {
    if (status >= 200 && status < 300) {
        console.log('Invoices imported:', body);
        feedbackMessage.style.display = 'block';
        setTimeout(() => {
            feedbackMessage.style.display = 'none';
        }, 3000); // Hide message after 3 seconds
    } else {
        console.error('Error importing invoices:', body.message || body);
    }
    csvUpload.value = ''; // Clear the file input
    importCsvBtn.disabled = true; // Disable the Import button
})
.catch(error => console.error('Error:', error));

            }
        });
    });
</script>
</body>
</html>
