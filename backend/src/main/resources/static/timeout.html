<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Timeout</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ffffff, #f0f4f8);
            overflow: hidden;
            color: #005149;
        }

        .timeout-message {
            text-align: center;
            animation: fadeIn 1.5s ease-in-out;
        }

        h1 {
            margin: 0;
            font-size: 50px;
            font-weight: 700;
            color: #005149;
            letter-spacing: 1.5px;
            animation: slideIn 2s ease-out;
        }

        p {
            margin-top: 20px;
            font-size: 22px;
            font-weight: 400;
            letter-spacing: 1px;
            color: #005149;
            animation: fadeInUp 2s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideIn {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes fadeInUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .highlight {
            color: #ffffff;
            background-color: #005149;
            padding: 10px 15px;
            border-radius: 25px;
            display: inline-block;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }

        .countdown {
            font-weight: bold;
            font-size: 1.5rem;
            color: #005149;
        }
    </style>
</head>
<body>
<div class="timeout-message">
    <h1>Session <span class="highlight">Expired</span></h1>
    <p>Your session has timed out. Redirecting to the login page in <span class="countdown" id="countdown">4</span> seconds...</p>
</div>

<script>
    // Countdown timer for 4 seconds
    let countdown = 5;
    function updateCountdown() {
        document.getElementById('countdown').textContent = countdown;
        if (countdown === 0) {
            window.location.href = 'login.html'; // Replace 'login.html' with your login page URL
        } else {
            countdown--;
            setTimeout(updateCountdown, 1000);
        }
    }
    window.onload = updateCountdown;
</script>
</body>
</html>
